name: Daily Scrape

on:
  schedule:
    # 7:00 AM ET (11:00 UTC) and 5:30 PM ET (21:30 UTC)
    - cron: '0 11 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

# A manual dispatch during a scheduled run would race the same branch on
# push. Queue instead of colliding; never cancel a run mid-scrape.
concurrency:
  group: scrape-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 180, not 90. Runs measured 88.3 and 88.7 min after the availability fix
    # added a second request per product, and run 31645766847 was CANCELLED at
    # 90.1 min. Under two minutes of headroom is not headroom.
    # This is a self-imposed limit, not a billing one: the repo is public, so
    # GitHub-hosted Actions minutes are free and unlimited. GitHub's own hard
    # cap is 6 hours per job, so 180 is well inside it.
    # Keep in step with CI_TIMEOUT_SECONDS in scrapers/runner.py.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Random 0-120s delay so we don't hit at the exact cron second every day
      - name: Random start delay
        run: |
          DELAY=$((RANDOM % 120))
          echo "Sleeping ${DELAY} seconds before starting..."
          sleep $DELAY

      # Snapshot the PREVIOUS cycle's prices before any scraper runs.
      #
      # Without this the sanity gate is a self-comparison: it reads
      # data/last_manifest.json, which every scraper step overwrites with THIS
      # run's prices long before the gate executes. Measured on this corpus,
      # the gate compared 735 prices against themselves and found 735 exactly
      # equal — a flawless 0% movement no matter how corrupt the data was. A
      # guard that cannot fire is worse than none, because it gets cited as a
      # reason none is needed: this one was, to justify removing the anomaly
      # write-block in 52b1ae52.
      #
      # Proven: with an honest baseline, tripling every price takes the gate
      # from exit 0 to exit 1 ("725/737 (98%) moved"). Calibrated against 128
      # real day-over-day cycles from 2026-04-03 on: worst genuine movement
      # 4.5% vs the 30% block threshold, zero false blocks.
      - name: Snapshot previous manifest
        run: |
          if [ -f data/last_manifest.json ]; then
            cp data/last_manifest.json data/prev_manifest.json
            echo "Baseline captured: $(wc -c < data/prev_manifest.json) bytes"
          else
            echo "::warning::No last_manifest.json — price-movement checks skipped this run."
          fi

      # --- Each nursery runs as its own step with continue-on-error ---
      - name: Scrape nature-hills
        continue-on-error: true
        id: nature_hills
        run: python -m scrapers.runner --retailer nature-hills --skip-promos

      - name: Scrape planting-tree
        continue-on-error: true
        id: planting_tree
        run: python -m scrapers.runner --retailer planting-tree --skip-promos

      - name: Scrape spring-hill
        continue-on-error: true
        id: spring_hill
        run: python -m scrapers.runner --retailer spring-hill --skip-promos

      - name: Scrape fast-growing-trees
        continue-on-error: true
        id: fast_growing_trees
        run: python -m scrapers.runner --retailer fast-growing-trees --skip-promos

      - name: Scrape proven-winners-direct
        continue-on-error: true
        id: proven_winners
        run: python -m scrapers.runner --retailer proven-winners-direct --skip-promos

      - name: Scrape great-garden-plants
        continue-on-error: true
        id: great_garden_plants
        run: python -m scrapers.runner --retailer great-garden-plants --skip-promos

      - name: Scrape stark-bros
        continue-on-error: true
        id: stark_bros
        run: python -m scrapers.runner --retailer stark-bros --skip-promos

      # --- Collect results, build, and commit regardless of individual failures ---
      - name: Report nursery health
        if: always()
        run: |
          echo "=== Nursery Scrape Health Report ==="
          echo "nature-hills:          ${{ steps.nature_hills.outcome }}"
          echo "planting-tree:         ${{ steps.planting_tree.outcome }}"
          echo "spring-hill:           ${{ steps.spring_hill.outcome }}"
          echo "fast-growing-trees:    ${{ steps.fast_growing_trees.outcome }}"
          echo "proven-winners-direct: ${{ steps.proven_winners.outcome }}"
          echo "great-garden-plants:   ${{ steps.great_garden_plants.outcome }}"
          echo "stark-bros:            ${{ steps.stark_bros.outcome }}"

          # Flag degraded nurseries (failures) but don't block deployment
          FAILED=0
          for step_outcome in "${{ steps.nature_hills.outcome }}" "${{ steps.planting_tree.outcome }}" "${{ steps.spring_hill.outcome }}" "${{ steps.fast_growing_trees.outcome }}" "${{ steps.proven_winners.outcome }}" "${{ steps.great_garden_plants.outcome }}" "${{ steps.stark_bros.outcome }}"; do
            if [ "$step_outcome" = "failure" ]; then
              FAILED=$((FAILED + 1))
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "WARNING: $FAILED nursery scraper(s) failed -- flagged as degraded"
          else
            echo "All nurseries scraped successfully"
          fi

      # --- Two kinds of check, deliberately different consequences:
      # ---   BLOCKING  — the OUTPUT would be bad (systemic data failure,
      # ---               build error, broken links). Nothing publishes; the
      # ---               site keeps serving the last known good build.
      # ---   ALARMING  — something needs attention but the output is fine
      # ---               (quarantined rows, test failures, a dead retailer).
      # ---               Good data publishes, then the job is marked failed.
      # --- Blocking on non-output problems is what let one `price: 0` row
      # --- stop all publishing indefinitely, so those are alarms now.
      - name: Strip unresolved variants
        run: python scripts/strip_unresolved_variants.py

      # exit 0 = clean · 1 = systemic, BLOCK · 3 = rows quarantined, publish + alarm
      - name: Data sanity gate
        run: |
          set +e
          python scripts/check_data_sanity.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Systemic data failure — nothing published this cycle."
            exit 1
          fi
          if [ "$code" = "3" ]; then
            echo "QUARANTINED=1" >> "$GITHUB_ENV"
          fi

      # Tests are fixture-based: they validate CODE, not this run's data, so a
      # failure must not stop price publishing. Output is guarded by the build
      # and link-check steps below. Failure detail is echoed into an ::error::
      # annotation because Actions logs require sign-in even on public repos —
      # the annotations API does not.
      - name: Run tests
        run: |
          set +e
          pytest -q > pytest_out.txt 2>&1
          code=$?
          set -e
          tail -40 pytest_out.txt
          if [ "$code" != "0" ]; then
            echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
            SUMMARY=$(grep -E "^(FAILED|ERROR)" pytest_out.txt | head -10 | tr '\n' ' | ')
            echo "::error::pytest failed (exit $code): ${SUMMARY:-see uploaded artifact}"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_out.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify prices (10 random spot checks)
        run: |
          set +e
          python -m scrapers.verify --count 10
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "VERIFY_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::Price spot-check mismatches — a scraper may be reading the wrong element."
          fi

      # MUST run before "Build site". build.py reads data/promos.json to render
      # every Specials cell, and the commit step publishes data/promos.json and
      # site/ in the SAME commit. When this step ran after the build, each cycle
      # shipped HTML built from the PREVIOUS cycle's promos alongside the
      # CURRENT cycle's promos.json — the two disagreed on arrival, breaking the
      # "git status --short site/ must be empty after a build" invariant in
      # CLAUDE.md and leaving every future site/ diff with a dirty baseline.
      #
      # It published wrong offers, not just a stale artifact: in a09a9f07 the
      # FGT code FAST20 was already gone from promos.json while 63 committed
      # pages still advertised it, and it stayed live until the next cycle
      # (3c548f16) happened to rebuild it away.
      #
      # The per-retailer steps above pass --skip-promos, so this is the only
      # thing that refreshes promos.json. Keep it here, and keep the trailing
      # `|| echo` — a promo fetch failure must never stop price publishing.
      - name: Scrape promo codes
        run: |
          python -c "
          import sys, json
          from pathlib import Path
          sys.path.insert(0, '.')
          from scrapers.runner import scrape_promos, load_json
          retailers = load_json(Path('data/retailers.json'))
          scrape_promos(retailers)
          " || echo "WARNING: Promo scraping failed -- skipping"

      - name: Build site
        run: python -X utf8 build.py

      - name: Verify internal links
        run: |
          python -c "
          import os, re
          broken = 0
          for root, dirs, files in os.walk('site'):
              for f in files:
                  if not f.endswith('.html'): continue
                  path = os.path.join(root, f)
                  with open(path, encoding='utf-8') as fh:
                      content = fh.read()
                  for link in re.findall(r'href=\"(/[^\"#]+)\"', content):
                      if link.startswith('/assets/'): continue
                      link_path = os.path.join('site', link.lstrip('/'))
                      if not os.path.exists(link_path):
                          print(f'BROKEN: {path} -> {link}')
                          broken += 1
          if broken > 0:
              print(f'{broken} broken internal links!')
              exit(1)
          print('All internal links OK')
          "

      # ALARMING, not blocking — see the BLOCKING vs ALARMING note above.
      # These six audits run against the data just scraped and the site just
      # built. They exist because runner.py scores health as
      # products_found / products_expected, so a WRONG price counts as a hit:
      # a missing product trips an alarm, a wrong price trips nothing. The FGT
      # positional size/price bug survived at least 15 days that way.
      #
      # This step must never gate the publish. It runs after the build and
      # exits nonzero only to set a flag that "Raise alarms" reads at the end,
      # by which point the commit has already happened.
      #
      # Audit D compares this run's rows against the previous run's rows in
      # the committed data/prices/*.jsonl, NOT against data/prev_manifest.json
      # — that file is written by the snapshot step above but is absent from
      # the commit step's `git add` list, so it does not exist on a fresh
      # checkout and would give the audit a denominator of 0 every time.
      - name: Nightly offline audits
        run: |
          set +e
          python -X utf8 scripts/nightly_audits.py | tee audit_out.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            echo "AUDITS_ALARMED=1" >> "$GITHUB_ENV"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit
          path: |
            audit_out.txt
            data/audit_report.json
          retention-days: 30
          if-no-files-found: warn

      # Machine-checks the CLAUDE.md invariant instead of trusting step order:
      # rebuild, and confirm nothing changes. Anything a second build alters is
      # a build input that some step wrote AFTER the first build — exactly the
      # defect that shipped the expired code FAST20 to 63 pages.
      #
      # `git add` first, then compare the index tree BEFORE the rebuild against
      # the index tree AFTER it. site/ is a committed build artifact, so it
      # differs from HEAD on every cycle that moved a price; staging makes the
      # first tree hold the first build's output so the comparison isolates
      # first-build-vs-rebuild and nothing else. Comparing against HEAD here
      # would fire on every normal run. The commit step below re-adds site/, so
      # staging early changes nothing about what publishes.
      #
      # Two staged trees, NOT `git diff -- site/` against the index: `git diff`
      # never reports untracked paths, so the worktree-vs-index form was blind
      # to a rebuild that ADDS a page (a new plant, category or guide) — the
      # single most likely shape of "a build input changed after the build".
      # Proven on this repo: `git add -A site/` then `echo x >
      # site/plants/__probe.html` and `git diff --quiet -- site/` still
      # reported a no-op. `git add -A` picks additions and deletions up, and
      # comparing the two tree objects sees all three kinds of change.
      #
      # ALARMING, never BLOCKING — and now enforced twice, because the previous
      # version enforced it zero times. Divergence itself was safe (the `git
      # diff --quiet` sat in an `if`, so `-e` did not fire), but a non-zero
      # `git add` or a crashing rebuild would fail the step, skip the commit
      # below, and throw away a whole ~88-minute cycle of scraped prices. That
      # is the exact hazard the commit step's own comment warns about,
      # reintroduced one step upstream. So: the body swallows every exit code
      # and ends `exit 0`, and continue-on-error catches anything Actions
      # raises outside the body.
      #
      # `if: always()` on the COMMIT step is not the fix and must not be added:
      # the data sanity gate, the build and the link check all sit between the
      # checkout and the commit and are meant to BLOCK.
      # tests/test_audit_step_is_not_a_gate.py pins that choice.
      - name: Verify the build is reproducible
        continue-on-error: true
        run: |
          set +e
          git add -A site/
          add_rc=$?
          before=$(git write-tree)
          tree_rc=$?
          python -X utf8 build.py
          build_rc=$?
          if [ "$add_rc" -ne 0 ] || [ "$tree_rc" -ne 0 ] || [ "$build_rc" -ne 0 ]; then
            # A crashed rebuild can leave site/ half-written, and the commit
            # step below would publish that. The index holds the first build —
            # the one "Build site" produced and "Verify internal links" passed
            # — so restore the worktree from it and drop whatever the failed
            # rebuild created. Files from the FIRST build are staged, therefore
            # not untracked, therefore untouched by `git clean`.
            #
            # GATED ON `add_rc`, because that sentence is only true when the
            # `git add` above SUCCEEDED. When `git add` is what failed, the
            # index still holds HEAD, so `git checkout -- site/` would revert
            # the worktree to the PREVIOUS cycle's build while this cycle's
            # data/ commits anyway — publishing last cycle's HTML beside this
            # cycle's prices, under an annotation claiming a restore. Proven
            # against a real remote: site/index.html and site/plants/rose.html
            # arrived at the previous cycle's content while
            # data/prices/rose.jsonl carried the new price. Doing nothing is
            # strictly better than reverting a whole cycle of HTML.
            #
            # What the worktree holds once we decline to restore depends on WHY
            # we got here, and the annotation has to say which. If the rebuild
            # never ran or exited clean, the first build is intact. If the
            # rebuild CRASHED, it has already overwritten part of the first
            # build, so what publishes is half-written. An earlier version of
            # this comment asserted the first build survives unconditionally;
            # it does not, and the annotation must not repeat that claim.
            restore_rc=0
            clean_rc=0
            restored="no"
            if [ "$add_rc" -eq 0 ]; then
              git checkout -- site/
              restore_rc=$?
              git clean -fdq site/
              clean_rc=$?
              # BOTH exit codes, not just the checkout's. Each was discarded at
              # some point, and each discard produced an annotation asserting a
              # success that had not happened. A failed checkout published
              # half-written HTML and a clobbered, hand-maintained
              # site/bot.html. A failed clean is the same class one line down:
              # `git checkout` restores TRACKED files and cannot remove a file
              # the crashed rebuild CREATED — only `git clean` can — so when the
              # clean fails, every such file is still sitting in site/, where
              # the commit step's own `git add -A site/` sweeps it to the live
              # site. That is a PARTIAL restore however well the checkout went.
              # Report what actually happened instead of asserting.
              if [ "$restore_rc" -ne 0 ]; then
                restored="FAILED"
              elif [ "$clean_rc" -ne 0 ]; then
                restored="PARTIAL"
              else
                restored="yes"
              fi
            fi
            echo "REBUILD_CHECK_FAILED=1" >> "$GITHUB_ENV"
            if [ "$restored" = "yes" ]; then
              site_state="The first build WAS restored from the index and still publishes."
            elif [ "$restored" = "PARTIAL" ]; then
              site_state="git checkout restored site/ from the index, but git clean FAILED (rc=$clean_rc) — the tracked files were restored, and anything the crashed rebuild ADDED is still in site/ and publishes with them."
            elif [ "$restored" = "FAILED" ]; then
              site_state="git checkout FAILED (rc=$restore_rc) — site/ was NOT restored and may be half-written; whatever is in the worktree is what publishes."
            elif [ "$build_rc" -ne 0 ]; then
              site_state="git add failed before the first build could be staged — site/ could NOT be restored from the index, so no restore was attempted. The rebuild ALSO failed, so it may have overwritten part of the first build: the worktree may be half-written, and whatever is in it is what publishes."
            else
              site_state="git add failed before the first build could be staged — site/ could NOT be restored from the index, so no restore was attempted; the worktree was left as-is."
            fi
            echo "::error::The reproducibility check could not run (git add=$add_rc, write-tree=$tree_rc, rebuild=$build_rc). $site_state The check told us nothing this cycle."
            exit 0
          fi
          git add -A site/
          add2_rc=$?
          after=$(git write-tree)
          tree2_rc=$?
          if [ "$add2_rc" -ne 0 ] || [ "$tree2_rc" -ne 0 ]; then
            echo "REBUILD_CHECK_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::The reproducibility check could not stage the rebuild (git add=$add2_rc, write-tree=$tree2_rc). Publishing continues; the check told us nothing this cycle."
            exit 0
          fi
          if [ "$before" = "$after" ]; then
            echo "Rebuild is a no-op — committed site/ matches its sources."
          else
            echo "REBUILD_DIVERGED=1" >> "$GITHUB_ENV"
            echo "::error::Rebuilding site/ changed it — a step after 'Build site' wrote a build input. Files:"
            git diff --name-only "$before" "$after" -- site/
          fi
          exit 0

      - name: Commit updated price data
        id: commit
        run: |
          git config user.name "PlantPriceTracker Bot"
          git config user.email "bot@plantpricetracker.com"
          # audit_report.json is committed so a weekly digest can read it
          # straight from the repo. audit_baseline.json is NOT added here:
          # it is the accepted-findings list and is only ever changed by a
          # human running --update-baseline. A baseline CI could rewrite
          # would absorb the next regression on the night it appeared.
          git add data/prices/ data/last_manifest.json data/promos.json data/handle_maps.json site/
          # recovery.json only exists after a recovery pass has run
          if [ -f data/recovery.json ]; then git add data/recovery.json; fi
          # Guarded, not bare. This step runs under `bash -e`, so a `git add`
          # of a missing path aborts it and NOTHING publishes — which would
          # turn a deliberately non-blocking audit into a publish blocker, the
          # exact failure the BLOCKING vs ALARMING split exists to prevent.
          if [ -f data/audit_report.json ]; then git add data/audit_report.json; fi
          git diff --staged --quiet || git commit -m "Daily price update $(date +%Y-%m-%d_%H:%M)"
          # A human push during the ~50min run conflicts on site/ (a build
          # artifact that is committed). Retry the rebase a few times, and
          # abort cleanly rather than leaving the tree mid-rebase.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed (likely a concurrent push); retrying"
            sleep 15
          done
          echo "::error::Could not push after 3 attempts — this cycle's prices were not published."
          exit 1

      # Single alarm point. Runs last and always, so publishing has already
      # happened (or been deliberately blocked) before anything turns red.
      # Everything collected here is "needs attention", not "output is bad".
      - name: Raise alarms
        if: always()
        run: |
          PROBLEMS=""
          FAILED=""
          for pair in "nature-hills:${{ steps.nature_hills.outcome }}" \
                      "planting-tree:${{ steps.planting_tree.outcome }}" \
                      "spring-hill:${{ steps.spring_hill.outcome }}" \
                      "fast-growing-trees:${{ steps.fast_growing_trees.outcome }}" \
                      "proven-winners-direct:${{ steps.proven_winners.outcome }}" \
                      "great-garden-plants:${{ steps.great_garden_plants.outcome }}" \
                      "stark-bros:${{ steps.stark_bros.outcome }}"; do
            if [ "${pair##*:}" = "failure" ]; then
              FAILED="$FAILED ${pair%%:*}"
            fi
          done
          COMMITTED="${{ steps.commit.outcome }}"
          if [ -n "$FAILED" ]; then
            echo "::error::Scraper failed for:$FAILED — dead retailer or crash."
            PROBLEMS="$PROBLEMS scrapers"
          fi
          if [ "${QUARANTINED:-0}" = "1" ]; then
            echo "::error::Bad rows were quarantined — see the data gate warnings above."
            PROBLEMS="$PROBLEMS quarantine"
          fi
          if [ "${TESTS_FAILED:-0}" = "1" ]; then
            echo "::error::Test suite failed — code defect; see the pytest-output artifact."
            PROBLEMS="$PROBLEMS tests"
          fi
          if [ "${VERIFY_FAILED:-0}" = "1" ]; then
            echo "::error::Live price spot-checks mismatched."
            PROBLEMS="$PROBLEMS verify"
          fi
          if [ "${AUDITS_ALARMED:-0}" = "1" ]; then
            echo "::error::Nightly offline audits raised an alarm — see the nightly-audit artifact and the ::error:: lines above. Good data still published."
            PROBLEMS="$PROBLEMS audits"
          fi
          if [ "${REBUILD_DIVERGED:-0}" = "1" ]; then
            echo "::error::A rebuild changed site/ — some step now writes a build input after 'Build site'. Move it earlier. The corrected build was published."
            PROBLEMS="$PROBLEMS rebuild"
          fi
          # A check that could not run is not a check that passed. Say so out
          # loud rather than letting a silent no-result read as "reproducible".
          if [ "${REBUILD_CHECK_FAILED:-0}" = "1" ]; then
            echo "::error::The reproducibility check itself failed to run — this cycle has NO answer on whether the build reproduces. Prices still published."
            PROBLEMS="$PROBLEMS rebuild-check"
          fi
          # Say plainly whether data actually shipped, instead of assuming.
          if [ "$COMMITTED" = "success" ]; then
            echo "Publish: data from healthy retailers WAS published this cycle."
          else
            echo "::error::Publish: NOTHING was published this cycle (commit step: ${COMMITTED:-skipped})."
            PROBLEMS="$PROBLEMS publish"
          fi
          if [ -n "$PROBLEMS" ]; then
            echo "Problems:$PROBLEMS"
            exit 1
          fi
          echo "All healthy: 7/7 scrapers, data clean, tests green, audits quiet, published."

      # ====================================================================
      # ALERT PATH (open item B-2). Everything below this line is
      # NOTIFICATION ONLY and must never change what the run concludes.
      #
      # The problem it closes: until now the ONLY signal that a cycle went
      # wrong was the workflow's red/green dot on a page nobody opens. Every
      # ::error:: annotation above is written to a run page that has to be
      # visited to be read.
      #
      # THREE PROPERTIES, each enforced by a test in
      # tests/test_failure_alert_email.py rather than asserted in this comment:
      #
      #   1. These steps sit AFTER `Raise alarms`, which is the last step that
      #      can turn the run red, and after `Commit updated price data`. They
      #      are not in the blocking path: nothing here can stop a publish.
      #   2. Every one of them carries `continue-on-error: true`. A dead SMTP
      #      host, an expired token, a rate limit or a typo'd secret must not
      #      redden an otherwise-green cycle. A mail outage that manufactures
      #      a false alarm twice a day is worse than no mail at all — it
      #      trains the operator to ignore the mailbox.
      #   3. Missing secrets are a ::warning::, never a failure. An
      #      unconfigured mail path is a normal state for this repo (see the
      #      SMTP note in heartbeat.yml: the secrets have plausibly never been
      #      exercised), and it must be reported out loud on EVERY run rather
      #      than discovered on the night something breaks.
      #
      # PATH A (this) needs one-time secrets from the owner. PATH B (GitHub's
      # own workflow-failure notification email) needs no secrets and is the
      # fallback that is live today. Both are written up in ALERTS_RUNBOOK.md.
      # ====================================================================

      # `if: always()` on purpose, not `if: failure()`. This is the nag: a
      # green run that reports "SMTP is NOT configured" is how the owner learns
      # the mail path is dead BEFORE the night it is needed. Checked the same
      # way heartbeat.yml checks it, including the ALERT_-prefixed names — the
      # unprefixed forms collide with variables the runner already exports
      # (USERNAME in particular), which once made an unset secret test as
      # "configured" and reported a working mail path that did not exist.
      - name: Check whether alert email is configured
        id: smtp
        if: always()
        continue-on-error: true
        env:
          ALERT_SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          ALERT_SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set +e
          MISSING=""
          [ -z "${ALERT_SMTP_SERVER:-}" ]   && MISSING="$MISSING SMTP_SERVER"
          [ -z "${ALERT_SMTP_PORT:-}" ]     && MISSING="$MISSING SMTP_PORT"
          [ -z "${ALERT_SMTP_USERNAME:-}" ] && MISSING="$MISSING SMTP_USERNAME"
          [ -z "${ALERT_SMTP_PASSWORD:-}" ] && MISSING="$MISSING SMTP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failure-alert email is NOT configured (missing repository secrets:$MISSING). Failures will be signalled only by the red workflow run and by GitHub's own notification email. See ALERTS_RUNBOOK.md to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "SMTP secrets are present. Presence is not proof they work — only a delivered message is."
          fi
          exit 0

      # Composed by a script, not a heredoc, so the body is something pytest
      # can exercise offline. The SMTP hop cannot be proven without a live
      # server; the body can, so it is.
      - name: Compose failure alert
        id: alert
        if: failure()
        continue-on-error: true
        env:
          ALERT_COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          ALERT_SCRAPER_OUTCOMES: >-
            nature-hills=${{ steps.nature_hills.outcome }},
            planting-tree=${{ steps.planting_tree.outcome }},
            spring-hill=${{ steps.spring_hill.outcome }},
            fast-growing-trees=${{ steps.fast_growing_trees.outcome }},
            proven-winners-direct=${{ steps.proven_winners.outcome }},
            great-garden-plants=${{ steps.great_garden_plants.outcome }},
            stark-bros=${{ steps.stark_bros.outcome }}
        run: |
          set +e
          python -X utf8 scripts/compose_failure_alert.py
          rc=$?
          if [ "$rc" != "0" ] || [ ! -s alert_body.txt ]; then
            # Never let a broken composer swallow the alert. A short body that
            # carries the run URL is still worth sending.
            echo "::warning::compose_failure_alert.py did not produce a body (rc=$rc); falling back to a minimal one."
            {
              echo "The daily scrape for plantpricetracker.com finished RED."
              echo ""
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo ""
              echo "The alert composer itself failed (rc=$rc), so this message"
              echo "carries no detail. Open the run and read the 'Raise alarms'"
              echo "step, which names every problem in an ::error:: annotation."
            } > alert_body.txt
            echo "subject=[PlantPriceTracker] Daily Scrape FAILED (alert detail unavailable)" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # The one untestable step. `to:` defaults to the ops mailbox and can be
      # redirected with an optional ALERT_EMAIL_TO secret without touching this
      # file. `from:` falls back to SMTP_USERNAME rather than a made-up
      # noreply@ address: Proton (and most providers) reject a From the
      # authenticated account is not authorised to send as, which would fail
      # every send with a confusing 550 while the secrets all looked correct.
      - name: Send failure alert email
        id: mail
        if: failure() && steps.smtp.outputs.configured == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.alert.outputs.subject || '[PlantPriceTracker] Daily Scrape FAILED' }}
          to: ${{ secrets.ALERT_EMAIL_TO || 'projectgaiaa@proton.me' }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          body: file://alert_body.txt

      # Says in the run log which alert paths actually carried this failure,
      # so "I got no email" can be diagnosed from the run page alone. Echo
      # only — it never exits non-zero, because the run is already red and
      # this step must not be able to change that in either direction.
      - name: Report how this failure was signalled
        if: failure()
        continue-on-error: true
        run: |
          set +e
          echo "Signal paths for this failed run:"
          echo "  * red workflow run + ::error:: annotations — always present"
          echo "  * GitHub's own notification email (Path B, no secrets) — sent"
          echo "    by GitHub to the addresses configured on the account that"
          echo "    owns this workflow; see ALERTS_RUNBOOK.md"
          case "${{ steps.smtp.outputs.configured }}" in
            true)
              case "${{ steps.mail.outcome }}" in
                success) echo "  * SMTP alert (Path A) — ACCEPTED by the server. Acceptance is not delivery; check the mailbox." ;;
                *)       echo "::warning::  * SMTP alert (Path A) — DID NOT SEND (send step: ${{ steps.mail.outcome }}). Check the SMTP secrets. This failure is still visible as a red run." ;;
              esac
              ;;
            false)
              echo "::warning::  * SMTP alert (Path A) — UNAVAILABLE, secrets are not set. This failure exists only as a red run and whatever GitHub notifies natively."
              ;;
            *)
              # The configuration check is continue-on-error, so it can fail
              # and leave this output unset. "Unset" is NOT the same fact as
              # "secrets are missing", and reporting the second when the first
              # is true sends the operator to the secrets page over what may be
              # a broken check. Same rule as REBUILD_CHECK_FAILED above: a
              # check that could not run is not a check that answered.
              echo "::warning::  * SMTP alert (Path A) — UNKNOWN. The configuration check did not report a verdict (it is continue-on-error and may itself have failed), so no mail was attempted and this run cannot say why. Read the 'Check whether alert email is configured' step above."
              ;;
          esac
          exit 0
