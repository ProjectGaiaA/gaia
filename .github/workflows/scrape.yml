name: Daily Scrape

on:
  schedule:
    # 7:00 AM ET (11:00 UTC) and 5:30 PM ET (21:30 UTC)
    - cron: '0 11 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

# A manual dispatch during a scheduled run would race the same branch on
# push. Queue instead of colliding; never cancel a run mid-scrape.
concurrency:
  group: scrape-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Random 0-120s delay so we don't hit at the exact cron second every day
      - name: Random start delay
        run: |
          DELAY=$((RANDOM % 120))
          echo "Sleeping ${DELAY} seconds before starting..."
          sleep $DELAY

      # Snapshot the PREVIOUS cycle's prices before any scraper runs.
      #
      # Without this the sanity gate is a self-comparison: it reads
      # data/last_manifest.json, which every scraper step overwrites with THIS
      # run's prices long before the gate executes. Measured on this corpus,
      # the gate compared 735 prices against themselves and found 735 exactly
      # equal — a flawless 0% movement no matter how corrupt the data was. A
      # guard that cannot fire is worse than none, because it gets cited as a
      # reason none is needed: this one was, to justify removing the anomaly
      # write-block in 52b1ae52.
      #
      # Proven: with an honest baseline, tripling every price takes the gate
      # from exit 0 to exit 1 ("725/737 (98%) moved"). Calibrated against 128
      # real day-over-day cycles from 2026-04-03 on: worst genuine movement
      # 4.5% vs the 30% block threshold, zero false blocks.
      - name: Snapshot previous manifest
        run: |
          if [ -f data/last_manifest.json ]; then
            cp data/last_manifest.json data/prev_manifest.json
            echo "Baseline captured: $(wc -c < data/prev_manifest.json) bytes"
          else
            echo "::warning::No last_manifest.json — price-movement checks skipped this run."
          fi

      # --- Each nursery runs as its own step with continue-on-error ---
      - name: Scrape nature-hills
        continue-on-error: true
        id: nature_hills
        run: python -m scrapers.runner --retailer nature-hills --skip-promos

      - name: Scrape planting-tree
        continue-on-error: true
        id: planting_tree
        run: python -m scrapers.runner --retailer planting-tree --skip-promos

      - name: Scrape spring-hill
        continue-on-error: true
        id: spring_hill
        run: python -m scrapers.runner --retailer spring-hill --skip-promos

      - name: Scrape fast-growing-trees
        continue-on-error: true
        id: fast_growing_trees
        run: python -m scrapers.runner --retailer fast-growing-trees --skip-promos

      - name: Scrape proven-winners-direct
        continue-on-error: true
        id: proven_winners
        run: python -m scrapers.runner --retailer proven-winners-direct --skip-promos

      - name: Scrape great-garden-plants
        continue-on-error: true
        id: great_garden_plants
        run: python -m scrapers.runner --retailer great-garden-plants --skip-promos

      - name: Scrape stark-bros
        continue-on-error: true
        id: stark_bros
        run: python -m scrapers.runner --retailer stark-bros --skip-promos

      # --- Collect results, build, and commit regardless of individual failures ---
      - name: Report nursery health
        if: always()
        run: |
          echo "=== Nursery Scrape Health Report ==="
          echo "nature-hills:          ${{ steps.nature_hills.outcome }}"
          echo "planting-tree:         ${{ steps.planting_tree.outcome }}"
          echo "spring-hill:           ${{ steps.spring_hill.outcome }}"
          echo "fast-growing-trees:    ${{ steps.fast_growing_trees.outcome }}"
          echo "proven-winners-direct: ${{ steps.proven_winners.outcome }}"
          echo "great-garden-plants:   ${{ steps.great_garden_plants.outcome }}"
          echo "stark-bros:            ${{ steps.stark_bros.outcome }}"

          # Flag degraded nurseries (failures) but don't block deployment
          FAILED=0
          for step_outcome in "${{ steps.nature_hills.outcome }}" "${{ steps.planting_tree.outcome }}" "${{ steps.spring_hill.outcome }}" "${{ steps.fast_growing_trees.outcome }}" "${{ steps.proven_winners.outcome }}" "${{ steps.great_garden_plants.outcome }}" "${{ steps.stark_bros.outcome }}"; do
            if [ "$step_outcome" = "failure" ]; then
              FAILED=$((FAILED + 1))
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "WARNING: $FAILED nursery scraper(s) failed -- flagged as degraded"
          else
            echo "All nurseries scraped successfully"
          fi

      # --- Two kinds of check, deliberately different consequences:
      # ---   BLOCKING  — the OUTPUT would be bad (systemic data failure,
      # ---               build error, broken links). Nothing publishes; the
      # ---               site keeps serving the last known good build.
      # ---   ALARMING  — something needs attention but the output is fine
      # ---               (quarantined rows, test failures, a dead retailer).
      # ---               Good data publishes, then the job is marked failed.
      # --- Blocking on non-output problems is what let one `price: 0` row
      # --- stop all publishing indefinitely, so those are alarms now.
      - name: Strip unresolved variants
        run: python scripts/strip_unresolved_variants.py

      # exit 0 = clean · 1 = systemic, BLOCK · 3 = rows quarantined, publish + alarm
      - name: Data sanity gate
        run: |
          set +e
          python scripts/check_data_sanity.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Systemic data failure — nothing published this cycle."
            exit 1
          fi
          if [ "$code" = "3" ]; then
            echo "QUARANTINED=1" >> "$GITHUB_ENV"
          fi

      # Tests are fixture-based: they validate CODE, not this run's data, so a
      # failure must not stop price publishing. Output is guarded by the build
      # and link-check steps below. Failure detail is echoed into an ::error::
      # annotation because Actions logs require sign-in even on public repos —
      # the annotations API does not.
      - name: Run tests
        run: |
          set +e
          pytest -q > pytest_out.txt 2>&1
          code=$?
          set -e
          tail -40 pytest_out.txt
          if [ "$code" != "0" ]; then
            echo "TESTS_FAILED=1" >> "$GITHUB_ENV"
            SUMMARY=$(grep -E "^(FAILED|ERROR)" pytest_out.txt | head -10 | tr '\n' ' | ')
            echo "::error::pytest failed (exit $code): ${SUMMARY:-see uploaded artifact}"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_out.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify prices (10 random spot checks)
        run: |
          set +e
          python -m scrapers.verify --count 10
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "VERIFY_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::Price spot-check mismatches — a scraper may be reading the wrong element."
          fi

      - name: Build site
        run: python -X utf8 build.py

      - name: Verify internal links
        run: |
          python -c "
          import os, re
          broken = 0
          for root, dirs, files in os.walk('site'):
              for f in files:
                  if not f.endswith('.html'): continue
                  path = os.path.join(root, f)
                  with open(path, encoding='utf-8') as fh:
                      content = fh.read()
                  for link in re.findall(r'href=\"(/[^\"#]+)\"', content):
                      if link.startswith('/assets/'): continue
                      link_path = os.path.join('site', link.lstrip('/'))
                      if not os.path.exists(link_path):
                          print(f'BROKEN: {path} -> {link}')
                          broken += 1
          if broken > 0:
              print(f'{broken} broken internal links!')
              exit(1)
          print('All internal links OK')
          "

      - name: Scrape promo codes
        run: |
          python -c "
          import sys, json
          from pathlib import Path
          sys.path.insert(0, '.')
          from scrapers.runner import scrape_promos, load_json
          retailers = load_json(Path('data/retailers.json'))
          scrape_promos(retailers)
          " || echo "WARNING: Promo scraping failed -- skipping"

      - name: Commit updated price data
        id: commit
        run: |
          git config user.name "PlantPriceTracker Bot"
          git config user.email "bot@plantpricetracker.com"
          git add data/prices/ data/last_manifest.json data/promos.json data/handle_maps.json site/
          # recovery.json only exists after a recovery pass has run
          if [ -f data/recovery.json ]; then git add data/recovery.json; fi
          git diff --staged --quiet || git commit -m "Daily price update $(date +%Y-%m-%d_%H:%M)"
          # A human push during the ~50min run conflicts on site/ (a build
          # artifact that is committed). Retry the rebase a few times, and
          # abort cleanly rather than leaving the tree mid-rebase.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed (likely a concurrent push); retrying"
            sleep 15
          done
          echo "::error::Could not push after 3 attempts — this cycle's prices were not published."
          exit 1

      # Single alarm point. Runs last and always, so publishing has already
      # happened (or been deliberately blocked) before anything turns red.
      # Everything collected here is "needs attention", not "output is bad".
      - name: Raise alarms
        if: always()
        run: |
          PROBLEMS=""
          FAILED=""
          for pair in "nature-hills:${{ steps.nature_hills.outcome }}" \
                      "planting-tree:${{ steps.planting_tree.outcome }}" \
                      "spring-hill:${{ steps.spring_hill.outcome }}" \
                      "fast-growing-trees:${{ steps.fast_growing_trees.outcome }}" \
                      "proven-winners-direct:${{ steps.proven_winners.outcome }}" \
                      "great-garden-plants:${{ steps.great_garden_plants.outcome }}" \
                      "stark-bros:${{ steps.stark_bros.outcome }}"; do
            if [ "${pair##*:}" = "failure" ]; then
              FAILED="$FAILED ${pair%%:*}"
            fi
          done
          COMMITTED="${{ steps.commit.outcome }}"
          if [ -n "$FAILED" ]; then
            echo "::error::Scraper failed for:$FAILED — dead retailer or crash."
            PROBLEMS="$PROBLEMS scrapers"
          fi
          if [ "${QUARANTINED:-0}" = "1" ]; then
            echo "::error::Bad rows were quarantined — see the data gate warnings above."
            PROBLEMS="$PROBLEMS quarantine"
          fi
          if [ "${TESTS_FAILED:-0}" = "1" ]; then
            echo "::error::Test suite failed — code defect; see the pytest-output artifact."
            PROBLEMS="$PROBLEMS tests"
          fi
          if [ "${VERIFY_FAILED:-0}" = "1" ]; then
            echo "::error::Live price spot-checks mismatched."
            PROBLEMS="$PROBLEMS verify"
          fi
          # Say plainly whether data actually shipped, instead of assuming.
          if [ "$COMMITTED" = "success" ]; then
            echo "Publish: data from healthy retailers WAS published this cycle."
          else
            echo "::error::Publish: NOTHING was published this cycle (commit step: ${COMMITTED:-skipped})."
            PROBLEMS="$PROBLEMS publish"
          fi
          if [ -n "$PROBLEMS" ]; then
            echo "Problems:$PROBLEMS"
            exit 1
          fi
          echo "All healthy: 7/7 scrapers, data clean, tests green, published."
